spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

logging:
  level:
    root: info
    sopt.jeolloga: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

kakao:
  client:
    client-id: ${KAKAO_CLIENT_ID}
    admin-key: ${KAKAO_ADMIN_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET}
    client-authentication-method: ${KAKAO_CLIENT_AUTHENTICATION_METHOD:client_secret_post}
    authorization-grant-type: ${KAKAO_AUTHORIZATION_GRANT_TYPE:authorization_code}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    scope:
      - profile_nickname
      - account_email

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:2592000000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}
  kakao-expiration: ${JWT_KAKAO_EXPIRATION:2592000000}

auth:
  redirect-uri:
    local: http://localhost:8080/auth/login
    prod: https://api.gototemplestay.com/v2/auth/login

naver:
  api:
    client-id: ${NAVER_API_CLIENT_ID}
    client-secret: ${NAVER_API_CLIENT_SECRET}
